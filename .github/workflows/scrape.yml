name: Scrape Volumo

on:
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated page slugs (e.g. main,tech-house,techno)'
        required: true
        default: 'main'
        type: string

run-name: "Scrape: ${{ inputs.sources }}"

# Serialize scrape runs so two devices dispatching at once don't race the
# state-branch push. cancel-in-progress=false → second run queues cleanly
# rather than dying.
concurrency:
  group: volumo-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4

      - name: Checkout state branch into _state
        uses: actions/checkout@v4
        with:
          ref: state
          path: _state
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium (if not cached)
        run: python -m playwright install --with-deps chromium

      - name: Run scrape
        env:
          VOLUMO_DATA_DIR: ${{ github.workspace }}/_state/data
          VOLUMO_SOURCES: ${{ inputs.sources }}
        run: python scrape_cloud.py

      - name: Commit and push state
        working-directory: _state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "scrape: ${{ inputs.sources }} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push origin HEAD:state
          fi
